[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-scheduler"
version = "0.1.0"
description = "A job scheduler that clones repositories, checks out commits, and runs scripts"
authors = [
    {name = "Filip Skubacz", email = "filip@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "GitPython>=3.1.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
job-scheduler = "job_scheduler.cli:main"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
select = ["E", "F", "I", "N", "W"]
line-length = 88
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"